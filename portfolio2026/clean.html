<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0B0C0E;color:#FFFFFF;font-family:"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
.card{width:min(420px,100%);background:#16181C;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px -30px rgba(6,102,235,.45);border-radius:24px;padding:32px}
h1{font-family:"Google Sans Flex","Google Sans",sans-serif;font-weight:800;font-size:30px;line-height:1.1;margin:0 0 8px}
p{margin:0 0 24px;color:rgba(255,255,255,.6);font-size:15px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
input[type=password]{width:100%;font:inherit;font-size:16px;color:#FFFFFF;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;outline:none}
input[type=password]:focus{box-shadow:0 0 0 3px color-mix(in srgb,#0666EB 40%,transparent)}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:14px;color:rgba(255,255,255,.6)}
button{width:100%;font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:14px;background:#0666EB;color:#FFFFFF;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:10px;color:#0B0C0E;user-select:text}
.err{min-height:20px;margin-top:12px;font-size:14px;color:#E5484D}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Oriane Van Loo</h1>
  <p>This portfolio is private. Enter the password you were given to view it.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" required autofocus>
  <div class="row"><input type="checkbox" id="rem"><label for="rem" style="margin:0;font-weight:400">Remember on this device</label></div>
  <button type="submit" id="go">View portfolio</button>
  <div class="err" id="err" role="alert"></div>
</form>
