<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#FFFDF5;color:#1E293B;font-family:"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
.card{width:min(420px,100%);background:#FFFFFF;border:2px solid #1E293B;box-shadow:4px 4px 0 0 #1E293B;border-radius:24px;padding:32px}
h1{font-family:"Google Sans Flex","Google Sans",sans-serif;font-weight:800;font-size:30px;line-height:1.1;margin:0 0 8px}
p{margin:0 0 24px;color:#64748B;font-size:15px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
input[type=password]{width:100%;font:inherit;font-size:16px;color:#1E293B;background:#FFFFFF;border:2px solid #1E293B;border-radius:14px;padding:14px 16px;outline:none}
input[type=password]:focus{box-shadow:0 0 0 3px color-mix(in srgb,#8B5CF6 40%,transparent)}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:14px;color:#64748B}
button{width:100%;font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:14px;background:#8B5CF6;color:#FFFFFF;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:10px;color:#FFFDF5;user-select:text}
.err{min-height:20px;margin-top:12px;font-size:14px;color:#E5484D}
</style>
</head>

async function derive(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},m,256));}
async function open(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},k,d(P.c));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();}
